url: https://s7-stats.github.io/nullis

template:
  bootstrap: 5
  light-switch: true
  bootswatch: flatly
  bslib:
    base_font: {google: "Source Serif 4"}
    heading_font: {google: "Fraunces"}
    code_font: {google: "Fira Mono"}
    primary: "#0A2947"
    link-color: "#AA1C41"
  math-rendering: katex

home:
  title: "nullis • `statim` Extension for Nonparametric Statistics"
  description: >
    A package designed to extend `statim` package for nonparametric statistics.

navbar:
  type: light
  structure:
    # left: [intro, reference, articles, news]
    right: [search, github, lightswitch, blog]
  components:
    # intro:
    #   text: Get started
    #   href: articles/nullis.html
    # reference:
    #   text: Reference
    #   href: reference/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/s7-stats/nullis
      aria-label: GitHub


reference:
  - title: H-test functions
    desc: Main functions for nonparametric H-tests
    contents:
    - FRIEDMAN_TEST
    - KW_TEST
    - JT_TEST

  - title: "Base `<class_stat_infer>` classes"
    desc: "Extension of `class_stat_infer` S7 class from `{statim}`"
    contents:
    - class_friedman_test
    - class_kw_test
    - class_jt_test

  - title: "`{nullis}` own `<var_id>` mappers"
    desc: Extension of `<var_id>` mappers in this package
    contents:
    - x_by_b

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    built_with: >
      Built with <a href="https://pkgdown.r-lib.org/">pkgdown</a>.

development:
  mode: auto
  version_label: default
  version_tooltip: "Version"
